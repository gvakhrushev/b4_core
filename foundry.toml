[profile.default]
fs_permissions = [{ access = "read", path = "./data" }, { access = "read-write", path = "./test/backtest/out" }]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The real-contract historical backtest (test/backtest/BacktestReal.t.sol) drives the whole
# protocol through ~5,500 daily marks x 4 products and needs a large per-test gas budget; this
# ceiling is far above any real transaction and only bounds that manual benchmark.
gas_limit = "40000000000"
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }

# Nightly deep profile for invariant campaigns (TEST_PLAN §1):
#   FOUNDRY_PROFILE=deep forge test --match-path 'test/invariant/*'
[profile.deep]
fuzz = { runs = 4096 }
invariant = { runs = 512, depth = 256, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
