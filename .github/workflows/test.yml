name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly deep invariant campaign (V3-CI-1: the deep profile previously ran only on
    # push/PR/dispatch, so the 512×256 campaign was never exercised on a schedule).
    - cron: "0 3 * * *"

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Supply-chain: these actions SHOULD be pinned to full commit SHAs before
      # production (a moved tag runs attacker code with checkout read access). Left as
      # version tags here for readability; pin at release. (RAW-COV12-SUPPLY-001)
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable` (V3-CI-1 / RAW-COV12-SUPPLY-002). `stable` is a MOVING channel:
          # a new release can change fuzz/invariant scheduling or a lint, so a green run stops
          # meaning the same thing over time and a red one cannot be reproduced. `solc_version`
          # is already pinned in foundry.toml; this pins the toolchain around it.
          # The remaining supply-chain gap is the action tags above — pinning those needs the
          # full commit SHA of each release, which has to be looked up at release time.
          version: "1.7.1"

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        # Size gate covers PRODUCTION contracts only. Test harnesses (e.g. EngineHarness)
        # inherit the full engine for leg-level access and are never deployed, so EIP-170
        # does not apply to them; skipping test/script keeps the gate meaningful.
        run: forge build --sizes --skip 'test/**' --skip 'script/**'

      # B4Vault delegatecalls B4VaultOps and B4VaultRecovery, so all three run against ONE
      # storage. Their layouts match only because each inherits B4VaultStorage and adds no state
      # of its own — until this step, nothing enforced that. Declaring a variable on a module
      # instead of on the shared base makes it read slots the vault never writes, and the unit
      # tests cannot see it: at runtime every call already shares the vault's storage, so the
      # divergence is a compile-time property only a layout comparison catches.
      - name: Storage-layout guard (delegatecall modules)
        run: ./script/check-storage-layout.sh

      # A reference to a test that does not exist reads as evidence, so it suppresses the very
      # checking it appears to have had: Keeper.sol cited test/unit/GasBounds.t.sol as the source
      # of all four of its gas budgets, three times, and the file had never existed. Same rot
      # attacks INVARIANTS.md, whose whole value is the invariant -> test mapping, and the finding
      # registry, whose promise is the test named in its last column.
      - name: Citation integrity (live docs, traceability, registry)
        run: ./script/check-citations.sh

      - name: Run Forge tests
        run: forge test -vvv

  slither:
    name: Static analysis (Slither)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to match the test job (V3-CI-1): one toolchain across every gate.
          version: "1.7.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        # Pin the analyzer version (V3-CI-1): the triage in SLITHER.md /
        # slither.config.json is calibrated to 0.11.4, and a new release can add/rename a
        # detector and move the `--fail-high` gate under us. Bump deliberately + re-triage.
        run: pip install slither-analyzer==0.11.4

      # Enforce the SECURITY_MODEL §5 static-analysis gate on every push/PR: reject any
      # NEW high-severity finding. The triaged, documented false positives (SLITHER.md)
      # are excluded via slither.config.json; run WITHOUT that config periodically and
      # re-triage. (RAW-COV12: missing static-analysis gate)
      - name: Slither (reject high-severity)
        run: slither . --fail-high

  deep-invariant:
    name: Deep invariant campaign (nightly)
    # Only on the nightly schedule or a manual dispatch — the 512×256 profile is far too
    # slow for every push/PR (V3-CI-1: the deep profile had no scheduler before).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to match the test job (V3-CI-1): one toolchain across every gate.
          version: "1.7.1"

      - name: Run deep invariant campaign
        env:
          FOUNDRY_PROFILE: deep
        run: forge test --match-path 'test/invariant/*' -vvv
